<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>apple-vision — training metrics</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --page:      #f9f9f7;
    --surface:   #ffffff;
    --ink:       #0b0b0b;
    --ink-2:     #52514e;
    --muted:     #898781;
    --border:    rgba(11,11,11,0.10);
    --grid:      #e1e0d9;
    --accent:    #2a78d6;
    --accent-2:  #1baf7a;
    --shadow:    0 1px 2px rgba(11,11,11,0.04), 0 8px 24px -12px rgba(11,11,11,0.18);
    --shadow-hover: 0 1px 2px rgba(11,11,11,0.05), 0 16px 32px -12px rgba(11,11,11,0.24);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page:      #0d0d0d;
      --surface:   #17171a;
      --ink:       #ffffff;
      --ink-2:     #c3c2b7;
      --muted:     #8f8d87;
      --border:    rgba(255,255,255,0.10);
      --grid:      #2c2c2a;
      --accent:    #3987e5;
      --accent-2:  #199e70;
      --shadow:    0 1px 2px rgba(0,0,0,0.3), 0 8px 24px -12px rgba(0,0,0,0.6);
      --shadow-hover: 0 1px 2px rgba(0,0,0,0.4), 0 16px 32px -12px rgba(0,0,0,0.7);
    }
  }

  * { box-sizing: border-box; }

  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    max-width: 1080px;
    margin: 0 auto;
    padding: 3rem 1.5rem 4rem;
    color: var(--ink);
    background:
      radial-gradient(700px 320px at 15% -10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent),
      radial-gradient(600px 280px at 100% 0%, color-mix(in srgb, var(--accent-2) 10%, transparent), transparent),
      var(--page);
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  header { margin-bottom: 2rem; }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 0.6rem;
  }
  .eyebrow::before {
    content: "";
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent-2);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent-2) 22%, transparent);
  }

  h1 {
    font-size: clamp(1.6rem, 3vw, 2.1rem);
    line-height: 1.15;
    margin: 0 0 0.5rem;
    letter-spacing: -0.02em;
  }

  .subtitle {
    color: var(--ink-2);
    margin: 0;
    font-size: 0.95rem;
    max-width: 60ch;
  }
  .subtitle a { color: var(--accent); text-decoration: none; border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
  .subtitle a:hover { border-color: var(--accent); }

  .tabs {
    display: inline-flex;
    gap: 0.25rem;
    padding: 0.25rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    box-shadow: var(--shadow);
    margin-bottom: 2rem;
  }
  .tabs button {
    font: inherit;
    font-size: 0.88rem;
    font-weight: 500;
    padding: 0.5rem 1rem;
    border: none;
    border-radius: 7px;
    background: transparent;
    color: var(--ink-2);
    cursor: pointer;
    transition: background-color 0.15s ease, color 0.15s ease;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button.active {
    background: var(--accent);
    color: #fff;
  }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.25rem;
  }

  figure {
    margin: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 1rem 1rem 0.85rem;
    box-shadow: var(--shadow);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }
  figure:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-hover);
  }

  .img-wrap {
    background: #fff;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--grid);
  }
  img { display: block; width: 100%; height: auto; }

  figcaption {
    margin-top: 0.7rem;
    font-size: 0.85rem;
    color: var(--ink-2);
    text-align: center;
  }

  footer {
    margin-top: 2.5rem;
    font-size: 0.8rem;
    color: var(--muted);
  }

  @media (max-width: 700px) {
    .grid { grid-template-columns: 1fr; }
    body { padding: 2rem 1.25rem 3rem; }
  }
</style>
</head>
<body>
  <header>
    <div class="eyebrow">Live from Weights &amp; Biases</div>
    <h1>Apple detector — training metrics</h1>
    <p class="subtitle">
      AP and AR100 across the synthetic-data sweep. Refresh via
      <a href="https://github.com/philippsnr/apple-vision/actions/workflows/update-plots.yml" target="_blank" rel="noopener">GitHub Actions → Run workflow</a>.
    </p>
  </header>

  <div class="tabs" role="tablist">
    <button type="button" data-variant="line" class="active">Mean ± Std</button>
    <button type="button" data-variant="scatter">Scatter (all runs)</button>
  </div>

  <div class="grid">
    <figure>
      <div class="img-wrap">
        <img data-base="charts/ap_over_aug_factor" src="charts/ap_over_aug_factor.png" alt="AP vs. Augmentation Factor">
      </div>
      <figcaption>AP vs. Augmentation Factor (synthetic_n = 0)</figcaption>
    </figure>
    <figure>
      <div class="img-wrap">
        <img data-base="charts/ap_over_synthetic_n" src="charts/ap_over_synthetic_n.png" alt="AP vs. Number of Synthetic Images">
      </div>
      <figcaption>AP vs. Number of Synthetic Images (aug_factor = 1)</figcaption>
    </figure>
    <figure>
      <div class="img-wrap">
        <img data-base="charts/ar100_over_aug_factor" src="charts/ar100_over_aug_factor.png" alt="AR100 vs. Augmentation Factor">
      </div>
      <figcaption>AR100 vs. Augmentation Factor (synthetic_n = 0)</figcaption>
    </figure>
    <figure>
      <div class="img-wrap">
        <img data-base="charts/ar100_over_synthetic_n" src="charts/ar100_over_synthetic_n.png" alt="AR100 vs. Number of Synthetic Images">
      </div>
      <figcaption>AR100 vs. Number of Synthetic Images (aug_factor = 1)</figcaption>
    </figure>
  </div>

  <footer>apple-vision · synthetic-data ablation dashboard</footer>

  <script>
    const tabs = document.querySelectorAll(".tabs button");
    const images = document.querySelectorAll("img[data-base]");

    tabs.forEach((tab) => {
      tab.addEventListener("click", () => {
        tabs.forEach((t) => t.classList.toggle("active", t === tab));
        const variant = tab.dataset.variant;
        images.forEach((img) => {
          img.src = variant === "line"
            ? `${img.dataset.base}.png`
            : `${img.dataset.base}_${variant}.png`;
        });
      });
    });
  </script>
</body>
</html>
